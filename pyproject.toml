[project]
name = "sentiflow"
version = "0.1.0"
description = "German tweet sentiment (SB10k) with MLflow tracking, Optuna sweeps and a model registry"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "datasets>=5.1.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.17.2",
    "optuna>=5.0.0",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.2.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentiflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
